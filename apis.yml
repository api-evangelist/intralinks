description: >-
  Intralinks is a cloud-based virtual data room and secure file sharing platform used for M&A transactions, due
  diligence, and confidential business collaboration. The platform provides APIs for programmatic access to workspaces,
  documents, folders, groups, users, and permissions, enabling integration with enterprise document management and deal
  workflow systems.
